<!DOCTYPE html>
<html lang="en">

<!-- Built on Ramprasad Manna's open source stopwatch-timer code -->

<head>
    <meta charset="UTF-8">
    <title>Stopwatch + Timer - Stopwatch</title>
    <link rel="stylesheet" href="../../../misc/stopwatch-timer/stopwatch/stopwatch.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="icon" type="image/png" sizes="32x32" href="../../../favicon.png" />
</head>

    <header class="logo">
        <img src="../../../misc/stopwatch-timer/stopwatch/SW.png" alt="SWLogo" width="402" height="242">

    </header>

	<body>

		<div id='timer'>00:00:00:00</div>
		<div id='labels'>
			<span id='hh'>Hrs</span>
			<span id='mm'>Mins</span>
			<span id='ss'>Secs</span>
			<span id='ms'>Ms</span>
		</div>

		<div id='controls'>
			<button onclick='startTimer()' id='go'>Start</button>
			<button onclick='stopTimer()'  id='stop'>Stop</button>
			<button onclick='clearTimer()' id='clear'>Reset</button>
		</div>

        <p> 

        </p>

	</body>
</html>
